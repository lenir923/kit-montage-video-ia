<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#F4F2EE;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#1C1B1A}
.halo{position:absolute;left:-560px;top:-120px;width:1200px;height:1200px;pointer-events:none}
.halo div{position:absolute;border:2px solid rgba(28,27,26,.07);border-radius:50%}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:120px}
.logo{display:flex;flex-direction:column;align-items:center;gap:34px}
.tile{width:300px;height:300px;border-radius:66px;background:linear-gradient(160deg,#EE9A6E 0%,#DA7756 55%,#CE6B4B 100%);box-shadow:0 30px 60px rgba(206,107,75,.28),0 8px 18px rgba(0,0,0,.10),inset 0 3px 0 rgba(255,255,255,.35),inset 0 -6px 14px rgba(0,0,0,.10);display:flex;align-items:center;justify-content:center}
.tile img{width:190px;height:190px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12))}
.name{font-weight:700;font-size:84px;letter-spacing:-3px;line-height:1}
.x{font-weight:500;font-size:72px;letter-spacing:-2px;margin-top:-70px}
.right{font-weight:700;font-size:104px;letter-spacing:-4px;line-height:1.02;margin-top:-70px}
</style></head><body>
<div class="halo">
 <div style="left:0;top:0;width:1200px;height:1200px"></div>
 <div style="left:130px;top:130px;width:940px;height:940px"></div>
 <div style="left:260px;top:260px;width:680px;height:680px"></div>
</div>
<div class="wrap">
 <div class="logo"><div class="tile"><img src="claude.svg"></div><div class="name">Claude</div></div>
 <div class="x">x</div>
 <div class="right">PME<br>Agroalimentaire</div>
</div>
</body></html>
